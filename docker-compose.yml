version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mynetwork

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - mynetwork

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mynetwork

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - mynetwork

  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: taskMgmt_task_user_service
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8070:8070"
    networks:
      - mynetwork



  user-service:
    build: ./task-user-service
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      - EUREKA_SERVER=http://eureka-server:8070/eureka/
      - MYSQL_HOST=mysql-container
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=taskMgmt_task_user_service
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
    networks:
      - mynetwork
    depends_on:
      - eureka-server
      - mysql

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "8082:8080"
    environment:
      - EUREKA_SERVER=http://eureka-server:8070/eureka/
      - MYSQL_HOST=mysql-container
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=taskMgmt_task_service
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    networks:
      - mynetwork
    depends_on:
      - eureka-server
      - mysql
      - kafka
      - elasticsearch

  submission-service:
    build: ./task-submission-service
    container_name: submission-service
    ports:
      - "8083:8080"
    environment:
      - EUREKA_SERVER=http://eureka-server:8070/eureka/
      - MYSQL_HOST=mysql-container
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=taskMgmt_task_submission_service
      - MYSQL_USER=user
      - MYSQL_PASSWORD=user_password
    networks:
      - mynetwork
    depends_on:
      - eureka-server
      - mysql

  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - EUREKA_SERVER=http://eureka-server:8070/eureka/
    networks:
      - mynetwork
    depends_on:
      - eureka-server

  frontend:
    build: ./task-management-ui
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - mynetwork
    depends_on:
      - user-service
      - task-service
      - submission-service
      - gateway

networks:
  mynetwork:
    driver: bridge

volumes:
  mysql_data:
  es_data:
